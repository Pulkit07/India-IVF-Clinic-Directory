<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found | OpenIVF</title>
    <style>
      :root { font-family: Arial, sans-serif; color: #172421; background: #f7f9f8; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; }
      main { width: min(600px, calc(100% - 48px)); border-top: 1px solid #172421; padding-top: 24px; }
      p { color: #52605d; line-height: 1.6; }
      .eyebrow { color: #28675f; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      h1 { font-size: clamp(40px, 7vw, 68px); line-height: 1; letter-spacing: -.04em; margin: 24px 0; }
      a { display: inline-block; margin-top: 16px; padding: 12px 18px; color: white; background: #28675f; text-decoration: none; border-radius: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 · Page not found</p>
      <h1>That reference is not here.</h1>
      <p>Check the address, or return to the directory and begin again.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
